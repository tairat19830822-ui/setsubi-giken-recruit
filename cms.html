<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>設備技研 採用サイト CMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1A6BB0;
    --blue-dark:#14548c;
    --blue-light:#eaf3fb;
    --bg:#f4f7fa;
    --text:#1f2937;
    --border:#d7e3ee;
    --ok:#1c9a5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--blue);
    color:#fff;
    padding:14px 16px;
    font-weight:bold;
    font-size:16px;
    text-align:center;
    letter-spacing:.02em;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:16px;
  }

  /* ログイン画面 */
  .login-box{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:32px 20px;
    margin-top:40px;
    text-align:center;
  }
  .login-box p{margin:0 0 16px;color:#555;font-size:14px;}
  .login-box input{
    width:100%;
    padding:12px 14px;
    font-size:16px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:12px;
  }
  .login-box button{
    width:100%;
    padding:12px;
    font-size:15px;
    font-weight:bold;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:8px;
  }
  .login-error{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px;}

  /* CMS本体 */
  #cms{display:none;}

  .toolbar{
    display:flex;
    gap:10px;
    margin:16px 0;
    align-items:center;
  }
  select{
    flex:1;
    padding:12px;
    font-size:15px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
  }
  .status-msg{
    display:none;
    background:#e8f8ee;
    color:var(--ok);
    border:1px solid #b7e6c9;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    font-size:14px;
    margin-bottom:14px;
  }

  .row{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
  }
  .row__label{
    font-size:12px;
    color:var(--blue-dark);
    font-weight:bold;
    background:var(--blue-light);
    display:inline-block;
    padding:2px 8px;
    border-radius:5px;
    margin-bottom:6px;
  }
  .row__key{
    font-size:11px;
    color:#9aa5b1;
    margin-bottom:6px;
  }
  .row__value{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:10px;
  }
  .row__actions{display:flex;gap:8px;}
  .btn{
    padding:8px 14px;
    font-size:13px;
    border-radius:6px;
    border:1px solid var(--blue);
    background:#fff;
    color:var(--blue);
    font-weight:bold;
  }
  .btn--primary{
    background:var(--blue);
    color:#fff;
  }
  .btn--save{
    background:var(--ok);
    border-color:var(--ok);
    color:#fff;
  }
  textarea{
    width:100%;
    min-height:90px;
    padding:10px;
    font-size:14px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:10px;
    font-family:inherit;
    resize:vertical;
  }
  .loading, .empty{
    text-align:center;
    color:#888;
    padding:30px 0;
    font-size:14px;
  }

  @media (max-width:480px){
    .wrap{padding:10px;}
    .toolbar{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>

<header>設備技研 採用サイト CMS</header>

<div class="wrap">

  <!-- ログイン画面 -->
  <div class="login-box" id="login-box">
    <p>🔒 パスワードを入力してください</p>
    <input type="password" id="password-input" placeholder="パスワード" autocomplete="off">
    <button onclick="tryLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <!-- CMS本体 -->
  <div id="cms">
    <div class="status-msg" id="status-msg">✅ 保存しました</div>

    <div class="toolbar">
      <select id="section-select" onchange="loadSection()">
        <option value="section01">SECTION 01</option>
        <option value="section02">SECTION 02</option>
        <option value="section03">SECTION 03</option>
        <option value="section04">SECTION 04</option>
        <option value="section05">SECTION 05</option>
        <option value="section06">SECTION 06</option>
        <option value="section07">SECTION 07</option>
        <option value="section08">SECTION 08</option>
        <option value="section09">SECTION 09</option>
        <option value="section10">SECTION 10</option>
        <option value="section11">SECTION 11</option>
        <option value="section12">SECTION 12</option>
        <option value="footer">FOOTER</option>
      </select>
    </div>

    <div id="rows-container">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

</div>

<script>
  // ==========================================================
  // ↓↓↓ 設定はこの2行だけです ↓↓↓
  const SUPABASE_URL = "https://cellbbkeykydmelpxnrd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_cLEq5ppFdAfo-jPGyDgWtg_lk6yCt4T";
  // ↑↑↑ ここまで ↑↑↑
  // ==========================================================

  const CMS_PASSWORD = "setsubi2026";
  const TABLE_NAME = "site_content";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function tryLogin(){
    const input = document.getElementById('password-input').value;
    const errorEl = document.getElementById('login-error');
    if(input === CMS_PASSWORD){
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('cms').style.display = 'block';
      loadSection();
    }else{
      errorEl.textContent = 'パスワードが違います';
    }
  }
  document.getElementById('password-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryLogin();
  });

  async function loadSection(){
    const section = document.getElementById('section-select').value;
    const container = document.getElementById('rows-container');
    container.innerHTML = '<div class="loading">読み込み中...</div>';

    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .select('content_key, value, label')
      .eq('section', section)
      .order('content_key', { ascending: true });

    if(error){
      container.innerHTML = '<div class="empty">読み込みに失敗しました：' + error.message + '</div>';
      return;
    }
    if(!data || data.length === 0){
      container.innerHTML = '<div class="empty">このセクションのデータがありません</div>';
      return;
    }

    container.innerHTML = '';
    data.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="row__label">${escapeHtml(item.label || '')}</div>
        <div class="row__key">${escapeHtml(item.content_key)}</div>
        <div class="row__value" data-view>${escapeHtml(item.value || '')}</div>
        <textarea data-edit style="display:none;">${escapeHtml(item.value || '')}</textarea>
        <div class="row__actions">
          <button class="btn" data-edit-btn>編集</button>
          <button class="btn btn--save" data-save-btn style="display:none;">保存</button>
          <button class="btn" data-cancel-btn style="display:none;">キャンセル</button>
        </div>
      `;

      const viewEl = row.querySelector('[data-view]');
      const editEl = row.querySelector('[data-edit]');
      const editBtn = row.querySelector('[data-edit-btn]');
      const saveBtn = row.querySelector('[data-save-btn]');
      const cancelBtn = row.querySelector('[data-cancel-btn]');

      editBtn.addEventListener('click', () => {
        viewEl.style.display = 'none';
        editEl.style.display = 'block';
        editBtn.style.display = 'none';
        saveBtn.style.display = 'inline-block';
        cancelBtn.style.display = 'inline-block';
      });

      cancelBtn.addEventListener('click', () => {
        editEl.value = item.value || '';
        viewEl.style.display = 'block';
        editEl.style.display = 'none';
        editBtn.style.display = 'inline-block';
        saveBtn.style.display = 'none';
        cancelBtn.style.display = 'none';
      });

      saveBtn.addEventListener('click', async () => {
        const newValue = editEl.value;
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';

        const { error: updateError } = await supabaseClient
          .from(TABLE_NAME)
          .update({ value: newValue })
          .eq('content_key', item.content_key);

        saveBtn.disabled = false;
        saveBtn.textContent = '保存';

        if(updateError){
          alert('保存に失敗しました：' + updateError.message);
          return;
        }

        item.value = newValue;
        viewEl.textContent = newValue;
        viewEl.style.display = 'block';
        editEl.style.display = 'none';
        editBtn.style.display = 'inline-block';
        saveBtn.style.display = 'none';
        cancelBtn.style.display = 'none';

        showStatusMessage();
      });

      container.appendChild(row);
    });
  }

  function showStatusMessage(){
    const el = document.getElementById('status-msg');
    el.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;');
  }
</script>

</body>
</html>
